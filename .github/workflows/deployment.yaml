name: Deploy to EC2 Pre-production

on:
  push:
    branches: [preproduction] # Changed from preprod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Prevent hanging jobs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_PRIVATE_KEY_PREPROD }}

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST_PREPROD }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ConnectTimeout=30 ec2-user@${{ secrets.EC2_HOST_PREPROD }} << 'EOF'
            set -e  # Exit on any error
            
            # Navigate to the correct directory
            cd /home/ec2-user/apps/kraya-web

            # Mark repo as safe
            git config --global --add safe.directory /home/ec2-user/apps/kraya-web

            # Configure Git credentials for HTTPS
            git config --global credential.helper store
            echo "https://github-actions:${{ secrets.GH_PAT }}@github.com" > ~/.git-credentials

            # Set remote to HTTPS with token authentication
            git remote set-url origin https://github-actions:${{ secrets.GH_PAT }}@github.com/Kraya-Tech/kraya-web.git

            echo "📊 Checking system resources..."
            free -h
            df -h

            echo "🔄 Checking current git status..."
            git status
            git log --oneline -3

            echo "🔄 Pulling latest changes from preproduction branch..."
            git fetch origin preproduction  # Changed from preprod
            git checkout preproduction 2>/dev/null || git checkout -b preproduction origin/preproduction  # Changed from preprod
            git reset --hard origin/preproduction  # Changed from preprod

            echo "🛑 Stopping existing containers..."
            docker compose -f docker-compose.yaml down || true

            echo "🌐 Ensuring Docker network exists..."
            docker network create craya_network 2>/dev/null || echo "Network already exists"

            echo "🧹 Cleaning up Docker cache (selective)..."
            docker builder prune -f
            # Don't use system prune as it deletes networks

            echo "📦 Checking Docker system usage..."
            docker system df

            echo "🌐 Ensuring Docker network exists..."
            docker network create craya_network 2>/dev/null || echo "Network already exists"

            echo "🏗️ Building web-sf container..."
            timeout 600 docker compose -f docker-compose.yaml build web-sf

            echo "🏗️ Building web-sfb container..."
            timeout 600 docker compose -f docker-compose.yaml build web-sfb

            echo "🚀 Starting containers..."
            docker compose -f docker-compose.yaml up -d

            echo "⏳ Waiting for containers to start..."
            sleep 20

            echo "✅ Deployment completed. Current status:"
            docker compose -f docker-compose.yaml ps

            echo "🔍 Checking container health..."
            if docker compose -f docker-compose.yaml ps --format "{{.Status}}" | grep -q "Up"; then
              echo "✅ All containers are running successfully!"
            else
              echo "⚠️ Some containers might not be healthy. Showing logs:"
              docker compose -f docker-compose.yaml logs --tail=50
            fi

            echo "📝 Showing recent git commits:"
            git log --oneline -3

            echo "🎯 Final system status:"
            docker compose -f docker-compose.yaml ps
            docker system df

            # Clean up credentials for security
            rm -f ~/.git-credentials
          EOF

      - name: Verify deployment success
        run: |
          # Test if the services are accessible
          echo "🔍 Testing service accessibility..."

          # Test storefront (port 5000)
          timeout 30 bash -c 'until curl -s http://${{ secrets.EC2_HOST_PREPROD }}:5000 > /dev/null; do sleep 2; done' || echo "⚠️ Storefront not accessible yet"

          # Test storefront-builder (port 8000)  
          timeout 30 bash -c 'until curl -s http://${{ secrets.EC2_HOST_PREPROD }}:8000 > /dev/null; do sleep 2; done' || echo "⚠️ Storefront-builder not accessible yet"

          echo "🎉 Pre-production deployment pipeline completed!"
